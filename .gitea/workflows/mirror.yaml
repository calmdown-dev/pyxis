# This action runs in local Gitea, mirroring incoming commits to the associated
# GitHub repo; It does not run on GitHub.

name: Mirror to GitHub
on:
  push:
    branches:
      - master
    tags:
      - '**'

jobs:
  mirror:
    if: ${{ !gitea.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trust Home CA
        uses: https://shithub.home/calmdown.dev/trust-ca@v1
        with:
          certificate: ${{ vars.HOME_CA }}

      - name: Checkout the Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror to GitHub
        uses: https://shithub.home/calmdown.dev/mirror-gh@v1
        with:
          token: ${{ secrets.MIRROR_TOKEN }}
          repository: ${{ vars.MIRROR_REPO }}
