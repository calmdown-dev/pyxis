linkWorkspacePackages: true
preferWorkspacePackages: true
ignoreWorkspaceCycles: true
packages:
  - "./build-logic"
  - "./packages/*"

catalogMode: strict
catalog:
  "@calmdown/rolldown-workspace": 1.0.0-rc.9
  "@calmdown/rollup-plugin-copy": 2.0.0
  "@calmdown/rollup-plugin-delete": 1.0.2
  "@calmdown/rollup-plugin-shell": 1.0.0
  "@oxc-project/types": 0.153.0
  "@types/node": 26.6.5
  "lightningcss": 1.33.0
  "rolldown": 1.2.13
  "rolldown-plugin-dts": 0.28.8
  "typescript": 6.0.3
  "vite": 8.3.4
  "yaml": 2.9.1

overrides:
  "rolldown": 1.2.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@calmdown/*"

minimumReleaseAge: 10080 # 2w
minimumReleaseAgeExclude:
  - "@calmdown/*"
